<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo do Volume da Esfera</title>
    <link rel="stylesheet" href="pratica03exercicio05.css">
</head>

<body>
    <div class="container">
        <h1>Volume da Esfera</h1>
        <p>Insira o valor do raio da esfera para calcular o seu volume.</p>

        <div class="input-group">
            <label for="raio">Raio da Esfera:</label>
            <input type="number" id="raio" placeholder="Digite o raio" step="any" min="0">
        </div>

        <button onclick="calcularVolume()">Calcular Volume</button>

        <p id="resultado"></p>
    </div>

    <script src="pratica03exercicio05.js"></script>
</body>

</html>
