<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo da Área do Círculo</title>
    <link rel="stylesheet" href="pratica03exercicio04.css">
</head>

<body>
    <div class="container">
        <h1>Área do Círculo</h1>
        <p>Insira o valor do raio do círculo para calcular a sua área.</p>

        <div class="input-group">
            <label for="raio">Raio do Círculo:</label>
            <input type="number" id="raio" placeholder="Digite o raio" step="any" min="0">
        </div>

        <button onclick="calcularArea()">Calcular Área</button>

        <p id="resultado"></p>
    </div>

    <script src="pratica03exercicio04.js"></script>
</body>

</html>
