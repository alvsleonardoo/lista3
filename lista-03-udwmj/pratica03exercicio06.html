<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Juros Compostos</title>
    <link rel="stylesheet" href="pratica03exercicio06.css">
</head>

<body>
    <div class="container">
        <h1>Juros Compostos</h1>
        <p>Informe os dados abaixo para calcular o montante final.</p>

        <div class="input-group">
            <label for="capital">Capital Inicial (R$):</label>
            <input type="number" id="capital" placeholder="Ex: 1000.00" step="any" min="0">
        </div>

        <div class="input-group">
            <label for="taxa">Taxa de Juros (%):</label>
            <input type="number" id="taxa" placeholder="Ex: 5" step="any" min="0">
        </div>

        <div class="input-group">
            <label for="tempo">Prazo/Tempo:</label>
            <input type="number" id="tempo" placeholder="Ex: 12" step="any" min="0">
        </div>

        <button onclick="calcularJuros()">Calcular Montante</button>

        <p id="resultado"></p>
    </div>

    <script src="pratica03exercicio06.js"></script>
</body>

</html>
